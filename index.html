<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>17-Signal Macro Command Center</title>
  <style>
    :root {
      --bg-main: #0b1120; --bg-card: #131c31; --bg-input: #0f172a; --border: #263554;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --accent: #38bdf8;
      --green: #10b981; --green-bg: rgba(16,185,129,0.15);
      --amber: #f59e0b; --amber-bg: rgba(245,158,11,0.15);
      --red: #ef4444; --red-bg: rgba(239,68,68,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg-main); color: var(--text-primary); line-height: 1.5; padding-bottom: 50px; }
    .topbar { background: #0f172a; border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.05rem; font-weight: 700; }
    .badge-tag { background: rgba(56,189,248,0.15); color: var(--accent); padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button { cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
    button.primary { background: var(--accent); color: #0b1120; border-color: var(--accent); }
    .container { max-width: 1300px; margin: 0 auto; padding: 16px; }
    .hero-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 18px; }
    @media (max-width: 800px) { .hero-grid { grid-template-columns: 1fr; } }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .regime-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
    .regime-headline { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .regime-desc { color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 12px; }
    .gate-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { padding: 4px 10px; border-radius: 6px; font-size: 0.76rem; font-weight: 600; }
    .pill.green { background: var(--green-bg); color: var(--green); }
    .pill.amber { background: var(--amber-bg); color: var(--amber); }
    .pill.red { background: var(--red-bg); color: var(--red); }
    .score-box { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .score-circle { width: 90px; height: 90px; border-radius: 50%; border: 5px solid var(--accent); display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 8px; }
    .score-num { font-size: 1.5rem; font-weight: 800; }
    .score-sub { font-size: 0.65rem; color: var(--text-secondary); }
    .playbook-section { margin-bottom: 20px; }
    .role-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .role-tab.active { background: rgba(56,189,248,0.15); color: var(--accent); border-color: var(--accent); }
    .playbook-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
    .action-item { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .action-item h4 { font-size: 0.88rem; color: var(--accent); margin-bottom: 4px; }
    .action-item p { font-size: 0.82rem; color: var(--text-secondary); }
    .layers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 1000px) { .layers-grid { grid-template-columns: 1fr; } }
    .layer-header { padding: 10px 14px; background: #162038; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
    .layer-header h2 { font-size: 0.95rem; }
    .layer-header p { font-size: 0.76rem; color: var(--text-secondary); }
    .signal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .sig-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
    .sig-name { font-size: 0.86rem; font-weight: 700; }
    .sig-num { color: var(--accent); }
    .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; }
    .status-green { background: var(--green-bg); color: var(--green); }
    .status-amber { background: var(--amber-bg); color: var(--amber); }
    .status-red { background: var(--red-bg); color: var(--red); }
    .sig-input-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .sig-input-row input, .sig-input-row select { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); padding: 5px 8px; border-radius: 6px; font-size: 0.84rem; width: 120px; }
    .sig-unit, .sig-rule { font-size: 0.76rem; color: var(--text-secondary); }
    .sig-source a { font-size: 0.72rem; color: var(--accent); text-decoration: none; }
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; max-width: 600px; width: 100%; padding: 18px; }
    .modal textarea { width: 100%; height: 150px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.8rem; margin: 10px 0; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .toast { position: fixed; bottom: 16px; right: 16px; background: var(--green); color: #0b1120; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; display: none; z-index: 300; }
  </style>
</head>

        ar: { name: "حصة تداولات الأفراد", unit: "%", rule: "فوق 75% ينذر بهوس المضاربة وتقلبات عنيفة." },
        sourceName: "EGX Activity", sourceUrl: "https://egx.com.eg",
        eval: function(v) { return v >= 75 ? 'red' : (v >= 55 ? 'amber' : 'green'); } },
      { id: 's17_policy_shock', layer: 2, num: 17, type: 'select',
        options: [{ val: 'none', en: 'Normal Calendar', ar: 'طبيعي' }, { val: 'intervention', en: 'State Buying', ar: 'تدخل حكومي' }, { val: 'tax_deadline', en: 'Tax / Reg Shock', ar: 'موعد ضريبي/تنظيمي' }],
        en: { name: "Policy & Tax Calendar", unit: "event", rule: "Tax deadlines & regulatory shifts trigger sudden cash drains." },
        ar: { name: "الضرائب والتدخل الحكومي", unit: "حدث", rule: "مواعيد الضرائب والتنظيمات تسبب سحب سيولة مفاجئ." },
        sourceName: "MoF / Central Banks", sourceUrl: "https://mof.gov.eg",
        eval: function(v) { return v === 'tax_deadline' ? 'red' : (v === 'intervention' ? 'amber' : 'green'); } }
    ];
    var playbooks = {
      household: {
        en: [
          { title: "1. 90-Day Liquidity Shield", desc: "Keep 3-6 months of expenses in high-yield safe instruments (T-bills/savings with positive real rates)." },
          { title: "2. Kill Variable Debt", desc: "Pay off credit cards and variable loans immediately while interest rates stay elevated." },
          { title: "3. Calm DCA (No FOMO)", desc: "Never buy after 100% dinner-table hype. Accumulate gold/index funds slowly below the 200-DMA." }
        ],
        ar: [
          { title: "1. درع السيولة لـ 90 يوماً", desc: "احتفظ بمصاريف 3-6 أشهر في أذون خزانة أو حسابات ادخار ذات عائد حقيقي موجب." },
          { title: "2. تخلص من الديون المتغيرة", desc: "سدد بطاقات الائتمان والقروض متغيرة الفائدة فوراً في ظل الفائدة المرتفعة." },
          { title: "3. الشراء الدوري (لا لهوس المجالس)", desc: "لا تشترِ بعد قفزات 100%. اشترِ الذهب أو الصناديق بهدوء دون متوسط 200 يوم." }
        ]
      },
      business: {
        en: [
          { title: "1. Pre-Buy on Freight Lulls", desc: "Use Signal #11 to lock freight contracts and build buffer inventory before Red Sea/Suez bottlenecks hit costs." },
          { title: "2. Micro-Price Adjustments", desc: "When PMI Input Prices outpace Output Prices (#10), raise prices in small frequent steps to protect margins." },
          { title: "3. Audit Tech ROI (#15)", desc: "Only fund AI/software tools that demonstrably cut unit costs or raise net profit margins." }
        ],
        ar: [
          { title: "1. تأمين المخزون عند هدوء الشحن", desc: "استخدم مؤشر 11 لتثبيت عقود الشحن وزيادة المخزون قبل ارتفاع تكاليف الاستيراد." },
          { title: "2. التعديل التدريجي للأسعار", desc: "عند ارتفاع تكلفة المدخلات في مؤشر PMI (#10)، مرر الزيادة تدريجياً لحماية هوامشك." },
          { title: "3. تدقيق عائد التكنولوجيا (#15)", desc: "استثمر فقط في الأدوات التي تخفض التكلفة أو تزيد صافي الربح فعلياً." }
        ]
      },
      investor: {
        en: [
          { title: "1. Credit Spread Override (#9)", desc: "If High-Yield Spreads stay <4%, treat equity dips as buying opportunities rather than a 2008 crash." },
          { title: "2. Exit Leverage Bubbles (#13/#14)", desc: "Trim profits aggressively when Sector P/E >3x benchmark and Margin Debt hits records." },
          { title: "3. Gold First, Silver Later", desc: "Hold Gold for central bank backing (#6); rotate to Silver only when 2Y Yields (#3) peak." }
        ],
        ar: [
          { title: "1. فلتر هوامش الائتمان (#9)", desc: "إذا ظلت هوامش الائتمان تحت 4%، تعامل مع هبوط الأسهم كفرصة شراء وليس انهياراً." },
          { title: "2. اخرج من فقاعات الهامش (#13/#14)", desc: "اجنِ أرباحك عند تجاوز مضاعف الربحية 3 أضعاف المؤشر مع ديون هامش قياسية." },
          { title: "3. الذهب أولاً ثم الفضة", desc: "احتفظ بالذهب لدعم البنوك المركزية (#6)، وانتقل للفضة فقط عند ذروة الفائدة (#3)." }
        ]
      },
      executive: {
        en: [
          { title: "1. Follow Capex Bottlenecks (#12)", desc: "Align career and budgets with AI deployment, power grids, healthcare, and supply-chain logistics." },
          { title: "2. Focus on Monetization (#15)", desc: "Champion projects with measurable revenue conversion rather than unmonetized hype." },
          { title: "3. Hedge Personal Income", desc: "Tie bonuses to margin/revenue milestones and diversify savings across yield and hard assets." }
        ],
        ar: [
          { title: "1. اتبع نقاط الإنفاق الرأسمالي (#12)", desc: "اربط مهاراتك وميزانياتك بتطبيقات الذكاء الاصطناعي، الطاقة، الرعاية الصحية، واللوجستيات." },
          { title: "2. ركز على تحقيق الأرباح (#15)", desc: "ادعم المشاريع ذات العائد المالي الملموس بدلاً من المشاريع التجريبية غير المربحة." },
          { title: "3. تحوّط لدخلك الشخصي", desc: "اربط الحوافز بالأرباح ونوّع مدخراتك بين العائد الثابت والأصول الصلبة." }
        ]
      }
    };
    function evaluateDashboard() {
      var redCount = 0, amberCount = 0, evals = {};
      for (var i = 0; i < signalsMeta.length; i++) {
        var s = signalsMeta[i], st = s.eval(state[s.id]);
        evals[s.id] = st;
        if (st === 'red') redCount++; else if (st === 'amber') amberCount++;
      }
      var riskScore = Math.round(((redCount * 1.0 + amberCount * 0.5) / signalsMeta.length) * 100);
      var gate1Healthy = (evals.s9_hy_spread === 'green' && evals.s10_egypt_pmi !== 'red' && evals.s12_capex_trend === 'rising');
      var gate2Bubble = (evals.s13_sector_pe_mult === 'red' || evals.s14_margin_debt === 'record' || evals.s16_retail_share === 'red');
      var gate3GoldFloor = (evals.s6_cb_gold_tonnes === 'green');

      var scoreCircle = document.getElementById('score-circle');
      document.getElementById('score-num').textContent = riskScore;
      var scoreLabel = document.getElementById('score-label');

      if (riskScore >= 60) { scoreCircle.style.borderColor = '#ef4444'; scoreLabel.textContent = currentLang === 'en' ? 'HIGH STRESS' : 'ضغط مرتفع'; }
      else if (riskScore >= 35) { scoreCircle.style.borderColor = '#f59e0b'; scoreLabel.textContent = currentLang === 'en' ? 'SELECTIVE' : 'انتقائي'; }
      else { scoreCircle.style.borderColor = '#10b981'; scoreLabel.textContent = currentLang === 'en' ? 'EXPANSION' : 'توسع'; }

      var headlineEl = document.getElementById('regime-headline'), descEl = document.getElementById('regime-desc'), pillsEl = document.getElementById('gate-pills');
      if (currentLang === 'en') {
        if (evals.s9_hy_spread === 'red') { headlineEl.textContent = "REGIME: Credit Crunch — Preserve Capital"; descEl.textContent = "Credit spreads widening. Prioritize T-bills and cash liquidity."; }
        else if (gate2Bubble) { headlineEl.textContent = "REGIME: Resilient Economy + Speculative Bubble Risk"; descEl.textContent = "Real economy is growing, but extreme leverage/P/E warn of sharp sector pullbacks."; }
        else { headlineEl.textContent = "REGIME: 'No-Landing' Growth + Sticky Rate Cross-Currents"; descEl.textContent = "Credit is calm and capex supports growth, while elevated rates favor disciplined allocation."; }
        pillsEl.innerHTML = '<span class="pill ' + (gate1Healthy ? 'green' : 'amber') + '">Gate 1 Economy: ' + (gate1Healthy ? 'Expanding' : 'Mixed') + '</span>' +
          '<span class="pill ' + (gate2Bubble ? 'red' : 'green') + '">Gate 2 Bubble: ' + (gate2Bubble ? 'Danger' : 'Contained') + '</span>' +
          '<span class="pill ' + (gate3GoldFloor ? 'green' : 'amber') + '">Gate 3 Gold Floor: ' + (gate3GoldFloor ? 'Strong' : 'Weak') + '</span>';
      } else {
        if (evals.s9_hy_spread === 'red') { headlineEl.textContent = "التشخيص: أزمة ائتمان — حماية رأس المال"; descEl.textContent = "اتساع هوامش الائتمان. ركز على أذون الخزانة والسيولة."; }
        else if (gate2Bubble) { headlineEl.textContent = "التشخيص: اقتصاد متماسك مع مخاطر فقاعة مضاربة"; descEl.textContent = "الاقتصاد ينمو، لكن التقييمات والديون المرتفعة تنذر بتصحيح حاد."; }
        else { headlineEl.textContent = "التشخيص: نمو مستمر ('لا هبوط') مع فائدة مرتفعة"; descEl.textContent = "الائتمان هادئ والإنفاق يدعم النمو، مما يتطلب توزيعاً منضبطاً للأصول."; }
        pillsEl.innerHTML = '<span class="pill ' + (gate1Healthy ? 'green' : 'amber') + '">بوابة 1 الاقتصاد: ' + (gate1Healthy ? 'نمو' : 'متباين') + '</span>' +
          '<span class="pill ' + (gate2Bubble ? 'red' : 'green') + '">بوابة 2 الفقاعات: ' + (gate2Bubble ? 'خطر' : 'مسيطر عليها') + '</span>' +
          '<span class="pill ' + (gate3GoldFloor ? 'green' : 'amber') + '">بوابة 3 الذهب: ' + (gate3GoldFloor ? 'قوية' : 'ضعيفة') + '</span>';
      }
      return evals;
    }

    function renderAll() {
      var t = i18n[currentLang];
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('ui-title').textContent = t.title;
      document.getElementById('ui-subtitle').textContent = t.subtitle;
      document.getElementById('btn-copy-prompt').textContent = t.copyPrompt;
      document.getElementById('btn-paste-json').textContent = t.pasteJson;
      document.getElementById('btn-reset').textContent = t.reset;
      document.getElementById('btn-share').textContent = t.shareBtn;
      document.getElementById('btn-lang').textContent = t.langBtn;
      document.getElementById('lbl-regime-title').textContent = t.regimeTitle;
      document.getElementById('lbl-risk-index').textContent = t.riskIndex;
      document.getElementById('lbl-role-title').textContent = t.roleTitle;
      document.getElementById('modal-title').textContent = t.modalTitle;
      document.getElementById('modal-desc').textContent = t.modalDesc;
      document.getElementById('btn-cancel').textContent = t.cancel;
      document.getElementById('btn-apply').textContent = t.apply;

      var evals = evaluateDashboard();
      var roleKeys = Object.keys(t.roles), tabsHtml = '';
      for (var r = 0; r < roleKeys.length; r++) {
        var rk = roleKeys[r];
        tabsHtml += '<button class="role-tab ' + (currentRole === rk ? 'active' : '') + '" onclick="selectRole(\'' + rk + '\')">' + t.roles[rk] + '</button>';
      }
      document.getElementById('role-tabs').innerHTML = tabsHtml;

      var pbList = playbooks[currentRole][currentLang], pbHtml = '';
      for (var p = 0; p < pbList.length; p++) {
        pbHtml += '<div class="action-item"><h4>' + pbList[p].title + '</h4><p>' + pbList[p].desc + '</p></div>';
      }
      document.getElementById('playbook-grid').innerHTML = pbHtml;

      var layersHtml = '';
      for (var l = 0; l < t.layers.length; l++) {
        var layerObj = t.layers[l], cardsHtml = '';
        for (var sIdx = 0; sIdx < signalsMeta.length; sIdx++) {
          var s = signalsMeta[sIdx];
          if (s.layer !== l) continue;
          var st = evals[s.id], m = s[currentLang], inputHtml = '';
          if (s.type === 'number') {
            inputHtml = '<input type="number" step="' + s.step + '" value="' + state[s.id] + '" onchange="updateVal(\'' + s.id + '\', parseFloat(this.value))" />';
          } else {
            var opts = '';
            for (var o = 0; o < s.options.length; o++) {
              var opt = s.options[o];
              opts += '<option value="' + opt.val + '" ' + (state[s.id] === opt.val ? 'selected' : '') + '>' + opt[currentLang] + '</option>';
            }
            inputHtml = '<select onchange="updateVal(\'' + s.id + '\', this.value)">' + opts + '</select>';
          }
          cardsHtml += '<div class="signal-card"><div class="sig-top"><div class="sig-name"><span class="sig-num">#' + s.num + '</span> ' + m.name + '</div><span class="status-badge status-' + st + '">' + t.statusLabels[st] + '</span></div><div class="sig-input-row">' + inputHtml + '<span class="sig-unit">' + m.unit + '</span></div><div class="sig-rule">' + m.rule + '</div><div class="sig-source"><a href="' + s.sourceUrl + '" target="_blank">↗ ' + s.sourceName + '</a></div></div>';
        }
        layersHtml += '<div><div class="layer-header"><h2>' + layerObj.title + '</h2><p>' + layerObj.sub + '</p></div>' + cardsHtml + '</div>';
      }
      document.getElementById('layers-grid').innerHTML = layersHtml;
    }

    function updateVal(key, val) { if ((val !== null && !isNaN(val)) || typeof val === 'string') { state[key] = val; renderAll(); } }
    function selectRole(role) { currentRole = role; renderAll(); }
    function toggleLang() { currentLang = currentLang === 'en' ? 'ar' : 'en'; renderAll(); }
    function resetDefaults() { state = Object.assign({}, defaultValues); renderAll(); }
    function showToast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.style.display = 'block'; setTimeout(function() { el.style.display = 'none'; }, 3500); }
    function copyUpdatePrompt() {
      var promptText = 'Search live financial sources for today\'s verified figures for these 17 metrics. Do NOT guess any number; set unverifiable fields to null. Return ONLY a single valid JSON object with these keys: {"s1_dist_days": 3, "s2_gold_200dma_gap": -4.5, "s3_us2y_yield": 4.35, "s4_tga_trend": "draining", "s5_dxy": 104.2, "s6_cb_gold_tonnes": 60, "s7_etf_flow": "outflow", "s8_gsr": 82.0, "s9_hy_spread": 3.15, "s10_egypt_pmi": 50.4, "s11_oil_wti": 78.5, "s12_capex_trend": "rising", "s13_sector_pe_mult": 1.4, "s14_margin_debt": "moderate", "s15_monetization": "positive", "s16_retail_share": 35, "s17_policy_shock": "none"}';
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(promptText).then(function() { showToast(i18n[currentLang].toastCopied); }); }
      else { openJsonModal(); document.getElementById('json-input').value = promptText; }
    }
        function shareVerdict() {
      var title = document.getElementById('regime-headline').textContent;
      var score = document.getElementById('score-num').textContent;
      var label = document.getElementById('score-label').textContent;
      var desc = document.getElementById('regime-desc').textContent;
      var url = window.location.href;
      var summary = currentLang === 'en'
        ? "📊 *17-Signal Macro Command Center*\n• *Risk Score:* " + score + "/100 (" + label + ")\n• *Diagnosis:* " + title + "\n• *Takeaway:* " + desc + "\n\n🔗 Live Tool: " + url
        : "📊 *مركز القيادة الاقتصادي (17 مؤشراً)*\n• *مؤشر المخاطر:* " + score + "/100 (" + label + ")\n• *التشخيص:* " + title + "\n• *الخلاصة:* " + desc + "\n\n🔗 الرابط المباشر: " + url;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(summary).then(function() { showToast(i18n[currentLang].toastShared); });
      } else {
        openJsonModal();
        document.getElementById('json-input').value = summary;
      }
    }
    function openJsonModal() { document.getElementById('json-input').value = ''; document.getElementById('json-modal').classList.add('open'); }
    function closeJsonModal() { document.getElementById('json-modal').classList.remove('open'); }
    function applyJsonData() {
      var raw = document.getElementById('json-input').value.trim();
      var start = raw.indexOf('{'), end = raw.lastIndexOf('}');
      if (start === -1 || end === -1) { alert(i18n[currentLang].toastError); return; }
      try {
        var parsed = JSON.parse(raw.substring(start, end + 1)), keys = Object.keys(defaultValues);
        for (var i = 0; i < keys.length; i++) { var k = keys[i]; if (parsed[k] !== undefined && parsed[k] !== null && parsed[k] !== '') state[k] = parsed[k]; }
        closeJsonModal(); renderAll(); showToast(i18n[currentLang].toastUpdated);
      } catch (e) { alert(i18n[currentLang].toastError); }
    }
    renderAll();
  </script>
