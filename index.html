<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market & Capital Compass (17-Indicator Engine)</title>
  <style>
    :root {
      --bg-main: #0b1120; --bg-card: #131c31; --bg-input: #0f172a; --border: #263554;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --accent: #38bdf8;
      --green: #10b981; --green-bg: rgba(16,185,129,0.15);
      --amber: #f59e0b; --amber-bg: rgba(245,158,11,0.15);
      --red: #ef4444; --red-bg: rgba(239,68,68,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--text-primary); line-height: 1.55; padding-bottom: 50px; }
    .topbar { background: #0f172a; border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.05rem; font-weight: 700; }
    .badge-tag { background: rgba(56,189,248,0.15); color: var(--accent); padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button { cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
    button.primary { background: var(--accent); color: #0b1120; border-color: var(--accent); }
    .container { max-width: 1300px; margin: 0 auto; padding: 16px; }
    .hero-grid { display: grid; grid-template-columns: 2.3fr 1fr; gap: 14px; margin-bottom: 18px; }
    @media (max-width: 850px) { .hero-grid { grid-template-columns: 1fr; } }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .regime-top-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .regime-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); }
    .as-of-badge { font-size: 0.74rem; color: var(--accent); background: rgba(56,189,248,0.1); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    .regime-headline { font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; }
    .logic-box { background: #0f172a; border-inline-start: 3px solid var(--accent); padding: 10px 12px; border-radius: 6px; font-size: 0.84rem; color: var(--text-primary); margin-bottom: 8px; }
    .logic-box.pro { border-inline-start-color: var(--amber); color: #cbd5e1; }
    .gate-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pill { padding: 4px 10px; border-radius: 6px; font-size: 0.76rem; font-weight: 600; }
    .pill.green { background: var(--green-bg); color: var(--green); }
    .pill.amber { background: var(--amber-bg); color: var(--amber); }
    .pill.red { background: var(--red-bg); color: var(--red); }
    .score-box { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .score-circle { width: 92px; height: 92px; border-radius: 50%; border: 5px solid var(--accent); display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 8px; }
    .score-num { font-size: 1.55rem; font-weight: 800; }
    .score-sub { font-size: 0.65rem; color: var(--text-secondary); }
    .playbook-section { margin-bottom: 20px; }
    .role-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .role-tab.active { background: rgba(56,189,248,0.15); color: var(--accent); border-color: var(--accent); }
    .playbook-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 850px) { .playbook-grid { grid-template-columns: 1fr; } }
    .action-item { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 13px; }
    .horizon-tag { display: inline-block; font-size: 0.72rem; font-weight: 700; color: var(--amber); background: var(--amber-bg); padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
    .action-item h4 { font-size: 0.9rem; color: var(--accent); margin-bottom: 5px; }
    .action-item p { font-size: 0.83rem; color: var(--text-secondary); }
    .layers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 1000px) { .layers-grid { grid-template-columns: 1fr; } }
    .layer-header { padding: 10px 14px; background: #162038; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
    .layer-header h2 { font-size: 0.95rem; }
    .layer-header p { font-size: 0.76rem; color: var(--text-secondary); }
    .signal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .sig-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
    .sig-name { font-size: 0.86rem; font-weight: 700; }
    .sig-num { color: var(--accent); }
    .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; }
    .status-green { background: var(--green-bg); color: var(--green); }
    .status-amber { background: var(--amber-bg); color: var(--amber); }
    .status-red { background: var(--red-bg); color: var(--red); }
    .sig-input-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .sig-input-row input, .sig-input-row select { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); padding: 5px 8px; border-radius: 6px; font-size: 0.84rem; width: 125px; }
    .sig-unit, .sig-rule { font-size: 0.76rem; color: var(--text-secondary); }
    .sig-source a { font-size: 0.72rem; color: var(--accent); text-decoration: none; }
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; max-width: 600px; width: 100%; padding: 18px; }
    .modal textarea { width: 100%; height: 150px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.8rem; margin: 10px 0; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .toast { position: fixed; bottom: 16px; right: 16px; background: var(--green); color: #0b1120; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; display: none; z-index: 300; }
  </style>
</head>

    <section class="card playbook-section">

      <div class="playbook-grid" id="playbook-grid"></div>

    <section class="layers-grid" id="layers-grid"></section>

        <button onclick="closeJsonModal()" id="btn-cancel">Cancel</button>
        <button class="primary" onclick="applyJsonData()" id="btn-apply">Update</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

    function updateVal(key, val) { if ((val !== null && !isNaN(val)) || typeof val === 'string') { state[key] = val; renderAll(); } }
    function selectRole(role) { currentRole = role; renderAll(); }
    function toggleLang() { currentLang = currentLang === 'en' ? 'ar' : 'en'; renderAll(); }
    function resetDefaults() { state = Object.assign({}, defaultValues); renderAll(); }
    function showToast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.style.display = 'block'; setTimeout(function() { el.style.display = 'none'; }, 3500); }

    function shareVerdict() {
      var title = document.getElementById('regime-headline').textContent;
      var score = document.getElementById('score-num').textContent;
      var label = document.getElementById('score-label').textContent;
      var plainText = document.getElementById('regime-plain').textContent;
      var url = window.location.href;
      var summary = currentLang === 'en'
        ? "🧭 *Market & Capital Compass* (" + state.as_of_date + ")\n• *Risk Score:* " + score + "/100 (" + label + ")\n• *" + title + "*\n• " + plainText + "\n\n🔗 Interactive Tool: " + url
        : "🧭 *بوصلة الأسواق ورأس المال* (" + state.as_of_date + ")\n• *مؤشر المخاطر:* " + score + "/100 (" + label + ")\n• *" + title + "*\n• " + plainText + "\n\n🔗 الأداة التفاعلية: " + url;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(summary).then(function() { showToast(i18n[currentLang].toastShared); });
      } else { openJsonModal(); document.getElementById('json-input').value = summary; }
    }

    function copyUpdatePrompt() {
      var promptText = 'Search live financial sources for today\'s latest verified figures and include today\'s date in "as_of_date". Follow these exact calibration rules so there are zero unit errors and minimal nulls: (1) Divide quarterly WGC central bank gold tonnage by 3 for s6_cb_gold_tonnes monthly rate; (2) Use S&P 500 for s1_dist_days (count of last 10 sessions where Open > Prev Close and Close < Open); (3) Use Nasdaq 100 P/E divided by S&P 500 P/E for s13_sector_pe_mult; (4) Map FINRA margin debt >$1.3T to "record", $0.9T-$1.3T to "moderate", <$0.9T to "low"; (5) Use EGX retail volume % (or US order flow %) for s16_retail_share. Set truly unverifiable fields to null. Return ONLY a single valid JSON object with these exact keys: {"as_of_date": "Nov 23, 2026", "s1_dist_days": 3, "s2_gold_200dma_gap": 4.2, "s3_us2y_yield": 4.76, "s4_tga_trend": "draining", "s5_dxy": 102.29, "s6_cb_gold_tonnes": 107.1, "s7_etf_flow": "inflow", "s8_gsr": 85.5, "s9_hy_spread": 3.52, "s10_egypt_pmi": 47.2, "s11_oil_wti": 83.5, "s12_capex_trend": "rising", "s13_sector_pe_mult": 1.45, "s14_margin_debt": "record", "s15_monetization": "positive", "s16_retail_share": 65, "s17_policy_shock": "none"}';
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(promptText).then(function() { showToast(i18n[currentLang].toastCopied); }); }
      else { openJsonModal(); document.getElementById('json-input').value = promptText; }
    }

    function openJsonModal() { document.getElementById('json-input').value = ''; document.getElementById('json-modal').classList.add('open'); }
    function closeJsonModal() { document.getElementById('json-modal').classList.remove('open'); }
    function applyJsonData() {
      var raw = document.getElementById('json-input').value.trim();
      var start = raw.indexOf('{'), end = raw.lastIndexOf('}');
      if (start === -1 || end === -1) { alert(i18n[currentLang].toastError); return; }
      try {
        var parsed = JSON.parse(raw.substring(start, end + 1)), keys = Object.keys(defaultValues);
        for (var i = 0; i < keys.length; i++) { var k = keys[i]; if (parsed[k] !== undefined && parsed[k] !== null && parsed[k] !== '') state[k] = parsed[k]; }
        closeJsonModal(); renderAll(); showToast(i18n[currentLang].toastUpdated);
      } catch (e) { alert(i18n[currentLang].toastError); }
    }
    renderAll();
  </script>
</body>
</html>
